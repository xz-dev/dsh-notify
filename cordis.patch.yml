# dsh-notify bundle patch. Bindings come from $DSH_HOME/dsh-notify.json (or configPath).
# herdr reporting is off: herdr's own agent integration already reports pane state.
- insert:
    - id: dsh-notify
      name: dsh-notify
      config:
        enableAgentNotifyTool: true
        enableAskUserHook: true
        enableHerdr: false
        allowProjectConfig: false
